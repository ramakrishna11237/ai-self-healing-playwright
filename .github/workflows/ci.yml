name: AI Automation Framework — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run full regression every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

# ── Cancel in-progress runs on new push ──────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Code Quality Gate
  # Runs first — fast feedback on code issues before running tests
  # ════════════════════════════════════════════════════════════════════════════
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Smoke Tests (runs on every push — fast, critical path only)
  # ════════════════════════════════════════════════════════════════════════════
  smoke:
    name: 🚀 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Smoke Tests
        run: npm run test:smoke
        env:
          CI: true
          FW_LOG_LEVEL: warn
          BASE_URL: https://the-internet.herokuapp.com
          APP_USERNAME: tomsmith
          APP_PASSWORD: SuperSecretPassword!
          ORANGEHRM_USERNAME: Admin
          ORANGEHRM_PASSWORD: admin123

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ github.run_number }}
          path: test-results/html-report/
          retention-days: 7

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshots-${{ github.run_number }}
          path: test-results/screenshots/
          retention-days: 3

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Demo Tests (all demo apps — internet, ecommerce, banking)
  # ════════════════════════════════════════════════════════════════════════════
  demo:
    name: 🎯 Demo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke

    strategy:
      fail-fast: false
      matrix:
        project: [demo:internet, demo:ecommerce, demo:all-layers]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
          FW_LOG_LEVEL: warn
          BASE_URL: https://the-internet.herokuapp.com
          APP_USERNAME: tomsmith
          APP_PASSWORD: SuperSecretPassword!
          ORANGEHRM_USERNAME: Admin
          ORANGEHRM_PASSWORD: admin123

      - name: Upload ${{ matrix.project }} report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.project }}-report-${{ github.run_number }}
          path: test-results/html-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Regression Tests (runs on schedule + manual trigger only)
  # ════════════════════════════════════════════════════════════════════════════
  regression:
    name: 🔄 Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: smoke
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Regression Tests
        run: npm run test:regression
        env:
          CI: true
          FW_LOG_LEVEL: warn
          BASE_URL: https://the-internet.herokuapp.com
          APP_USERNAME: tomsmith
          APP_PASSWORD: SuperSecretPassword!
          ORANGEHRM_USERNAME: Admin
          ORANGEHRM_PASSWORD: admin123

      - name: Upload regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ github.run_number }}
          path: test-results/html-report/
          retention-days: 14

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-traces-${{ github.run_number }}
          path: test-results/artifacts/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 — Final Summary Report
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [quality, smoke, demo]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🤖 AI Automation Framework — Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Smoke Tests  | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Demo Tests   | ${{ needs.demo.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
